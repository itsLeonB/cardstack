name: Compose images
description: >-
  Builds the compose stack's images with a GitHub Actions layer cache and
  restores a package cache that the tooling containers bind-mount.

inputs:
  services:
    description: Comma-separated compose services to build
    required: true
  cache:
    description: Package cache to restore, go or bun
    required: true
  lockfiles:
    description: Glob of the lockfiles that key the package cache
    required: true

runs:
  using: composite
  steps:
    - name: Restore the package cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/cardstack-${{ inputs.cache }}
        key: >-
          cardstack-${{ inputs.cache }}-${{ hashFiles(inputs.lockfiles) }}
        restore-keys: |
          cardstack-${{ inputs.cache }}-

    - name: Point the tooling containers at the cache directory
      shell: bash
      run: |
        dir="$HOME/.cache/cardstack-${{ inputs.cache }}"
        mkdir -p "$dir"
        echo "${INPUT_CACHE^^}_CACHE_DIR=$dir" >> "$GITHUB_ENV"
        # The images are built below, so the scripts must not build again.
        echo "SKIP_BUILD=1" >> "$GITHUB_ENV"
      env:
        INPUT_CACHE: ${{ inputs.cache }}

    - name: Set up Buildx
      uses: docker/setup-buildx-action@v3

    - name: Give each image its own layer cache scope
      id: scopes
      shell: bash
      run: |
        # One scope per image, so the images do not overwrite each other's
        # cache entries.
        {
          echo "set<<EOF"
          for service in ${INPUT_SERVICES//,/ }; do
            echo "$service.cache-from=type=gha,scope=cardstack-$service"
            echo "$service.cache-to=type=gha,mode=max,scope=cardstack-$service"
          done
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
      env:
        INPUT_SERVICES: ${{ inputs.services }}

    - name: Build the images
      uses: docker/bake-action@v6
      with:
        # Build the checked-out tree, as a local run does, not a Git clone.
        source: .
        files: compose.yaml
        targets: ${{ inputs.services }}
        load: true
        set: ${{ steps.scopes.outputs.set }}
