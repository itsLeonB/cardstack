name: Backend CI

# Every job runs the same script an agent runs locally, in the compose
# stack's tooling container (docs/agents/testing.md).

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "compose.yaml"
      - "compose.defaults.env"
      - "scripts/verification/**"
      - ".github/workflows/backend-ci.yml"
      - ".github/actions/compose-images/**"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "compose.yaml"
      - "compose.defaults.env"
      - "scripts/verification/**"
      - ".github/workflows/backend-ci.yml"
      - ".github/actions/compose-images/**"

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up the stack images
        uses: ./.github/actions/compose-images
        with:
          services: backend-tools
          cache: go
          lockfiles: backend/go.sum

      - name: Build
        run: scripts/verification/backend.sh build

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up the stack images
        uses: ./.github/actions/compose-images
        with:
          services: backend-tools
          cache: go
          lockfiles: backend/go.sum

      - name: Run tests
        run: scripts/verification/backend.sh test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up the stack images
        uses: ./.github/actions/compose-images
        with:
          services: backend-tools
          cache: go
          lockfiles: backend/go.sum

      - name: Run go vet
        run: scripts/verification/backend.sh vet

      - name: Check formatting
        run: scripts/verification/backend.sh format

      - name: Run golangci-lint
        run: scripts/verification/backend.sh lint
