name: Frontend CI

# Every job runs the same script an agent runs locally, in the compose
# stack's tooling container (docs/agents/testing.md).

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "compose.yaml"
      - "compose.defaults.env"
      - "scripts/verification/**"
      - ".github/workflows/frontend-ci.yml"
      - ".github/actions/compose-images/**"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - "compose.yaml"
      - "compose.defaults.env"
      - "scripts/verification/**"
      - ".github/workflows/frontend-ci.yml"
      - ".github/actions/compose-images/**"

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up the stack images
        uses: ./.github/actions/compose-images
        with:
          services: frontend-tools
          cache: bun
          lockfiles: frontend/bun.lock
      - run: scripts/verification/frontend.sh --package frontend lint

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up the stack images
        uses: ./.github/actions/compose-images
        with:
          services: frontend-tools
          cache: bun
          lockfiles: frontend/bun.lock
      - run: scripts/verification/frontend.sh --package frontend format

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up the stack images
        uses: ./.github/actions/compose-images
        with:
          services: frontend-tools
          cache: bun
          lockfiles: frontend/bun.lock
      - run: scripts/verification/frontend.sh --package frontend typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up the stack images
        uses: ./.github/actions/compose-images
        with:
          services: frontend-tools
          cache: bun
          lockfiles: frontend/bun.lock
      - run: scripts/verification/frontend.sh --package frontend test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up the stack images
        uses: ./.github/actions/compose-images
        with:
          services: frontend-tools
          cache: bun
          lockfiles: frontend/bun.lock
      - run: scripts/verification/frontend.sh --package frontend build
        env:
          # Public. The build passes without it (the app then renders a
          # configuration error), but a build meant to run needs it.
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
