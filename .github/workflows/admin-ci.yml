name: Admin CI

# Every job runs the same script an agent runs locally, in the compose
# stack's tooling container (docs/agents/testing.md).

on:
  push:
    branches: [main]
    paths:
      - "admin/**"
      - "frontend/tooling.Dockerfile"
      - "compose.yaml"
      - "compose.defaults.env"
      - "scripts/verification/**"
      - ".github/workflows/admin-ci.yml"
      - ".github/actions/compose-images/**"
  pull_request:
    branches: [main]
    paths:
      - "admin/**"
      - "frontend/tooling.Dockerfile"
      - "compose.yaml"
      - "compose.defaults.env"
      - "scripts/verification/**"
      - ".github/workflows/admin-ci.yml"
      - ".github/actions/compose-images/**"

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up the stack images
        uses: ./.github/actions/compose-images
        with:
          services: frontend-tools
          cache: bun
          lockfiles: admin/bun.lock
      - run: scripts/verification/frontend.sh --package admin lint

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up the stack images
        uses: ./.github/actions/compose-images
        with:
          services: frontend-tools
          cache: bun
          lockfiles: admin/bun.lock
      - run: scripts/verification/frontend.sh --package admin format

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up the stack images
        uses: ./.github/actions/compose-images
        with:
          services: frontend-tools
          cache: bun
          lockfiles: admin/bun.lock
      - run: scripts/verification/frontend.sh --package admin typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up the stack images
        uses: ./.github/actions/compose-images
        with:
          services: frontend-tools
          cache: bun
          lockfiles: admin/bun.lock
      - run: scripts/verification/frontend.sh --package admin test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up the stack images
        uses: ./.github/actions/compose-images
        with:
          services: frontend-tools
          cache: bun
          lockfiles: admin/bun.lock
      - run: scripts/verification/frontend.sh --package admin build
        env:
          # Public. Outside a Vercel production build the app builds without
          # them (it then renders a configuration error or calls localhost).
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
