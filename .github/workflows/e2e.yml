name: E2E

# Runs the frontend's Playwright suite against the compose stack's built user
# app: the production-style image served by the same script Vercel's rules are
# applied by, in front of the real API image, a fresh Postgres migrated and
# seeded with the deterministic e2e fixture. Deliberately independent of
# preview-environments.yml's per-PR Neon/Railway/Vercel stack — that pipeline
# provisions previews for humans to look at, not a target for CI to run tests
# against. It is the same script an agent runs (docs/agents/testing.md).

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "compose.yaml"
      - "compose.defaults.env"
      - "scripts/verification/**"
      - ".github/workflows/e2e.yml"
      - ".github/actions/compose-images/**"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "compose.yaml"
      - "compose.defaults.env"
      - "scripts/verification/**"
      - ".github/workflows/e2e.yml"
      - ".github/actions/compose-images/**"

permissions:
  contents: read

env:
  # The built app needs Clerk to load before it treats anyone as a guest. Fork
  # pull requests get no variables, so they fall back to this project's Clerk
  # development instance's publishable key (public by design: it only encodes
  # the instance's Frontend API domain).
  VITE_CLERK_PUBLISHABLE_KEY: >-
    ${{ vars.VITE_CLERK_PUBLISHABLE_KEY ||
    'pk_test_d29ya2luZy1jaGltcC01NzcxLmNsZXJrLmFjY291bnRzLmRldiQ=' }}

jobs:
  e2e:
    name: Playwright
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up the stack images
        uses: ./.github/actions/compose-images
        with:
          services: migrate,api,web,frontend-tools
          cache: bun
          lockfiles: frontend/bun.lock

      - name: Configure the API's Clerk settings
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
        run: |
          # The issuer is the Frontend API URL, which the publishable key
          # base64-encodes as "<domain>$". Fork pull requests get no secret,
          # so the API keeps the placeholders in compose.defaults.env and
          # only the signed-in specs need the real values.
          payload="${VITE_CLERK_PUBLISHABLE_KEY#pk_*_}"
          domain=$(printf '%s' "$payload" | base64 -d 2>/dev/null \
            | tr -d '$') || true
          if [[ -n "$CLERK_SECRET_KEY" && -n "$domain" ]]; then
            {
              echo "CLERK_SECRET_KEY=$CLERK_SECRET_KEY"
              echo "CLERK_ISSUER=https://$domain"
            } > backend/.env
          fi

      - name: Run Playwright e2e tests
        env:
          # Real sign-in (ticket 09), scoped to this step. Fork and Dependabot
          # pull requests get no secrets, so the signed-in specs skip there
          # while the guest specs run. Everywhere else the secrets must exist:
          # E2E_REQUIRE_SIGN_IN makes missing ones fail those specs, not skip.
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
          E2E_CLERK_USER_PASSWORD: ${{ secrets.E2E_CLERK_USER_PASSWORD }}
          E2E_REQUIRE_SIGN_IN: >-
            ${{ github.event.pull_request.head.repo.fork != true &&
            github.actor != 'dependabot[bot]' }}
        run: scripts/verification/frontend.sh e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
