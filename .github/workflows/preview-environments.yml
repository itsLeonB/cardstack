name: Preview Environments

# Provisions a preview stack for every pull request, so the Railway API deploys
# once per push, already configured:
#   1. a Neon database branch, forked from the production branch the first
#      time and then kept: later pushes and a reopened PR reuse it (and its
#      data) while it exists. Railway's pre-deploy migration is the only
#      migrator; this workflow never runs migrations
#   2. the Railway PR environment (Railway auto-creates it once "PR Deploys" is
#      enabled on the project) reconciled with
#      backend/infra/.railway/preview-vars.yml by scripts/preview-reconcile.py:
#      the overrides (APP_ENV=preview, Neon, the Clerk development instance)
#      and the derived APP_CLIENT_URLS are set and every production-only
#      variable is removed, in one API call that skips deployments. The API
#      keeps its Railway-provided domain
#   3. a fresh Vercel preview deployment pointed at that API and aliased to
#      cardstack-pr-<number>.vercel.app, the address the manifest already
#      allowed as APP_CLIENT_URLS, so it is stable across pushes
#   4. a PR comment listing the three addresses, updated in place on later
#      pushes
#
# The workflow never waits for the Railway deployment: Railway's Wait for CI
# holds the API's first deployment until every workflow on the commit has
# finished, so waiting would deadlock. An environment this workflow never
# reached keeps production's APP_ENV, which the API's boot guard refuses.
#
# Railway's own PR environment is torn down automatically by Railway when the
# PR is merged/closed. This workflow owns the Neon branch lifecycle (deleted on
# close), the PR's Vercel preview deployments, alias and the branch-scoped
# VITE_API_BASE_URL and VITE_CLERK_PUBLISHABLE_KEY env vars it adds to the
# Vercel project (none is removed by Vercel on its own), and the cross-wiring
# between all three.

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

# Provisioning runs for one PR queue behind each other instead of cancelling an
# in-flight run for an older push. A closing event cancels whatever is in
# flight so cleanup is not stuck behind a stale provisioning run.
concurrency:
  group: preview-environment-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event.action == 'closed' }}

# Default to no GITHUB_TOKEN permissions; each job opts into only what it
# needs.
permissions: {}

env:
  NEON_BRANCH_NAME: preview/pr-${{ github.event.pull_request.number }}
  RAILWAY_PR_NUMBER: ${{ github.event.pull_request.number }}
  # The preview frontend's stable address. The manifest's derive entry for
  # APP_CLIENT_URLS must be this origin (provisioning fails if it is not).
  FRONTEND_HOST: cardstack-pr-${{ github.event.pull_request.number }}.vercel.app

jobs:
  provision:
    name: Provision preview stack
    # pull_request from a fork (or Dependabot) doesn't get repo secrets, so
    # every credential below would be empty for them. Skip provisioning
    # rather than failing noisily; forked PRs simply don't get a preview.
    # Do NOT switch this to pull_request_target to "fix" that — it would
    # run this workflow (and expose secrets to) unreviewed PR code.
    if: >
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      # Public; the Clerk development instance's key, which the Railway
      # issuer and the Vercel build both derive from.
      CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
    steps:
      # create-branch-action returns an existing branch's details as-is
      # rather than resetting it, which is the persistence this workflow
      # relies on: the first run forks `production`, every later push (and a
      # reopened PR whose branch still exists) reuses the branch and its data,
      # and a missing branch is recreated. Never delete it here; closing the PR
      # does (see cleanup), and refreshing a preview is deleting the branch in
      # the Neon console.
      - name: Create Neon branch
        id: neon
        uses: neondatabase/create-branch-action@v5
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          parent: production
          branch_name: ${{ env.NEON_BRANCH_NAME }}
          api_key: ${{ secrets.NEON_API_KEY }}
          # Must already exist as a role/database on the `production`
          # branch (branching copies them); the action looks up their
          # connection details rather than creating new ones.
          username: ${{ secrets.NEON_ROLE_NAME }}
          database: ${{ secrets.NEON_DATABASE_NAME }}

      # The reconcile script and the manifest come from the PR's own checkout,
      # which only same-repo PRs reach (see the job condition). The step that
      # runs the script holds no secret: see the three Railway steps below.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # No later step needs authenticated git commands; avoid
          # persisting the GITHUB_TOKEN into the checkout while VERCEL_TOKEN
          # is also in scope for the build that follows.
          persist-credentials: false

      - name: Install Railway CLI
        # Pinned + installed through npm's integrity-checked registry
        # rather than piping the mutable install script through sh.
        run: npm install -g @railway/cli@5.49.3

      - name: Ensure PyYAML for the reconcile script
        # Not assumed to be on the runner image; the package is an apt install
        # away when it is missing.
        run: |
          python3 -c 'import yaml' 2>/dev/null || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq python3-yaml
          }
          python3 -I -c 'import yaml'

      - name: Link Railway CLI to the project
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
        run: |
          # Unlike a project token, an account token carries no implicit
          # project/environment context, so `environment list` needs an
          # explicit link first (it errors without one, non-interactively).
          # Any valid environment works here — this only bootstraps project
          # context; `environment list` returns every environment in the
          # linked *project*, ephemeral ones included, and later steps pass
          # --environment explicitly per call regardless.
          railway link --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID"

      - name: Find this PR's Railway environment
        id: railway-env
        env:
          # Must be an account-scoped token (RAILWAY_API_TOKEN), not a
          # project token — project tokens are pinned to the single
          # environment they were created for and can't see or act on
          # this PR's dynamically-created ephemeral environment (per
          # cashus's preview-environments.yml, where this was verified
          # against a live run against the same Railway account).
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          # Railway auto-creates a PR environment once "PR Deploys" is on
          # for the project. Poll for it to show up — creation happens
          # async after PR open.
          #
          # Match by name (not verified live for this project yet — carried
          # over from cashus, where the observed name was
          # "cashus-pr-<number>"; expect "cardstack-pr-<number>" here), not
          # the --ephemeral flag or meta.pr_number field — a cashus run
          # showed Railway had created and fully deployed the PR's
          # environment while --ephemeral/meta.pr_number-based matching
          # still found nothing for the full 5-minute window, so neither is
          # reliably queryable this way for environments Railway creates
          # natively via PR Deploys. `environment list --json` wraps the
          # array as {"environments": [...]} (verified against
          # railwayapp/cli's list.rs).
          last_list=""
          for i in $(seq 1 30); do
            last_list=$(railway environment list --json 2>/dev/null)
            match=$(echo "$last_list" | jq -c --arg pr "$RAILWAY_PR_NUMBER" \
              '[.environments[] | select(.name
                | test("(^|[^0-9])" + $pr + "([^0-9]|$)"))][0] // empty')
            if [[ -n "$match" ]]; then
              echo "name=$(jq -r .name <<<"$match")" >> "$GITHUB_OUTPUT"
              echo "id=$(jq -r .id <<<"$match")" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "::error::No Railway environment found for PR" \
            "#$RAILWAY_PR_NUMBER after 5 minutes." \
            "Is 'PR Deploys' enabled on the Railway project?"
          echo "Last 'railway environment list --json' output:"
          echo "$last_list"
          exit 1

      - name: Read the Railway API's public domain
        id: railway-domain
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_ENV: ${{ steps.railway-env.outputs.name }}
        run: |
          # The domain exists before the API's first deployment, so reading
          # it does not wait on Railway's Wait for CI. `domain list --json`
          # wraps the array as {"domains": [...]} (verified against
          # railwayapp/cli's domain.rs).
          for i in $(seq 1 30); do
            domain=$(railway domain list --service api \
              --environment "$RAILWAY_ENV" --json 2>/dev/null \
              | jq -r '[.domains[].domain][0] // empty')
            if [[ -n "$domain" ]]; then
              echo "url=https://$domain" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "::error::api service in Railway environment $RAILWAY_ENV" \
            "never got a public domain."
          exit 1

      # The next three steps are split by what they hold. The first has the
      # Railway token and runs no repository code; the second runs the PR's
      # own scripts/preview-reconcile.py and holds no credential at all; the
      # third has the Neon password and the Clerk development secret key and
      # runs no repository code (only jq and curl), so neither secret is ever
      # exposed to code from the PR checkout.
      - name: Read the Railway PR environment's variables
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_ENV: ${{ steps.railway-env.outputs.name }}
        run: |
          # Not piped, so a failed lookup fails the step (the default shell
          # has no pipefail). Sealed variables list with a null value.
          railway variable list --service api \
            --environment "$RAILWAY_ENV" --json > "$RUNNER_TEMP/listing.json"
          jq -e 'type == "object"' "$RUNNER_TEMP/listing.json" >/dev/null
          # Every value is a secret or sits next to one, and the next step
          # reads them. Nothing prints them; the ones long enough to be
          # secrets are masked first.
          while IFS= read -r v; do
            if [[ ${#v} -ge 8 ]]; then echo "::add-mask::$v"; fi
          done < <(jq -r '.[] | strings' "$RUNNER_TEMP/listing.json")

      - name: Plan the Railway PR environment's variables
        env:
          # Connection details, not credentials. The secrets the plan needs
          # are left out on purpose: the plan names them as placeholders and
          # the next step fills them in.
          NEON_HOST: ${{ steps.neon.outputs.host }}
          NEON_ROLE_NAME: ${{ secrets.NEON_ROLE_NAME }}
          NEON_DATABASE_NAME: ${{ secrets.NEON_DATABASE_NAME }}
        run: |
          # Previews use Clerk's development instance. The API verifies
          # tokens against its issuer, the Frontend API URL, which is the
          # publishable key's base64 payload ("<domain>$").
          payload="${CLERK_PUBLISHABLE_KEY#pk_*_}"
          domain=$(printf '%s' "$payload" | base64 -d 2>/dev/null \
            | tr -d '$') || true
          if [[ -z "$domain" ]]; then
            echo "::error::VITE_CLERK_PUBLISHABLE_KEY is missing or invalid."
            exit 1
          fi
          export CLERK_DEV_ISSUER="https://$domain"

          python3 -I scripts/preview-reconcile.py \
            --manifest backend/infra/.railway/preview-vars.yml \
            --pr "$RAILWAY_PR_NUMBER" --frontend-host "$FRONTEND_HOST" \
            "$RUNNER_TEMP/listing.json" > "$RUNNER_TEMP/plan.json"

      - name: Apply the plan to the Railway PR environment
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENV: ${{ steps.railway-env.outputs.name }}
          RAILWAY_ENV_ID: ${{ steps.railway-env.outputs.id }}
          # The sources of the plan's secret placeholders.
          NEON_PASSWORD: ${{ steps.neon.outputs.password }}
          CLERK_DEV_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
        run: |
          # The upsert below replaces every variable; never aim it at prod.
          if [[ -z "$RAILWAY_ENV_ID" || "${RAILWAY_ENV,,}" == production ]]
          then
            echo "::error::Refusing to configure Railway environment" \
              "'$RAILWAY_ENV': not a PR environment."
            exit 1
          fi
          # The plan comes from repository code: it may only ask for these two
          # secrets, not for any other credential this step holds.
          if ! jq -e '.secrets | all(.[]; IN("NEON_PASSWORD",
            "CLERK_DEV_SECRET_KEY"))' "$RUNNER_TEMP/plan.json" >/dev/null
          then
            echo "::error::The plan asks for a secret this step does not fill."
            exit 1
          fi
          # Nothing passes a secret on a command line: jq reads it from its
          # own environment and the result stays in a shell variable.
          variables=$(jq '. as $p | reduce ($p.secrets | to_entries[]) as $e
            ($p.variables; .[$e.key] = ((env[$e.value]
              | select(. != null and . != ""))
              // error("\($e.value) is not set")))' "$RUNNER_TEMP/plan.json")

          # Values that change are secrets or sit next to one; mask the ones
          # long enough to be secrets. APP_CLIENT_URLS is a derived public
          # origin that later steps pass on.
          while IFS= read -r v; do
            if [[ ${#v} -ge 8 ]]; then echo "::add-mask::$v"; fi
          done < <(jq -rs '. as [$v, $l] | $v | del(.APP_CLIENT_URLS)
            | to_entries[] | select(.value != $l[.key]) | .value | strings' \
            <(printf '%s' "$variables") "$RUNNER_TEMP/listing.json")

          # RAILWAY_* are Railway's own, not user variables: the plan leaves
          # them out, and so does this comparison.
          if jq -es '.[0] == (.[1] | with_entries(select(.key
            | startswith("RAILWAY_") | not)))' \
            <(printf '%s' "$variables") "$RUNNER_TEMP/listing.json" >/dev/null
          then
            echo "The Railway PR environment is already configured."
            exit 0
          fi

          # The sets and the removals go in one call that skips deployments,
          # so no deployment ever sees a half-configured set. `railway variable
          # delete` cannot skip deployments (Railway's variableDelete takes no
          # such option) and `railway variable edit --skip-deploys` still
          # deletes one variable at a time, so the whole set is written with
          # replace (the plan's variables are the remaining ones plus the sets,
          # minus the removals).
          railway_gql() {
            curl -fsS -X POST https://backboard.railway.com/graphql/v2 \
              -H "Authorization: Bearer $RAILWAY_API_TOKEN" \
              -H "Content-Type: application/json" --data-binary @-
          }
          services_query='query($p: String!) {
            project(id: $p) { services { edges { node { id name } } } } }'
          services=$(jq -n --arg q "$services_query" \
            --arg p "$RAILWAY_PROJECT_ID" \
            '{query: $q, variables: {p: $p}}' | railway_gql)
          service_id=$(jq -r '[.data.project.services.edges[].node
            | select(.name == "api")][0].id // empty' <<<"$services")
          if [[ -z "$service_id" ]]; then
            echo "::error::No api service found in the Railway project."
            exit 1
          fi
          upsert_query='mutation($i: VariableCollectionUpsertInput!) {
            variableCollectionUpsert(input: $i) }'
          response=$(jq -s --arg q "$upsert_query" \
            --arg p "$RAILWAY_PROJECT_ID" \
            --arg e "$RAILWAY_ENV_ID" --arg s "$service_id" \
            '{query: $q,
              variables: {i: {projectId: $p, environmentId: $e, serviceId: $s,
                variables: .[0], replace: true, skipDeploys: true}}}' \
            <<<"$variables" | railway_gql)
          if ! jq -e '.errors == null' <<<"$response" >/dev/null; then
            echo "::error::Railway rejected the variable update:" \
              "$(jq -r '[.errors[].message] | join("; ")' <<<"$response")"
            exit 1
          fi
          echo "Applied the variables and" \
            "$(jq '.removals | length' "$RUNNER_TEMP/plan.json")" \
            "removal(s), no deployment."

      - name: Point this PR's Vercel preview at the Railway API
        id: vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # Required for `vercel deploy` to resolve which project to act on
          # non-interactively — without these it expects a checked-in
          # .vercel/project.json from `vercel link` instead.
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          RAILWAY_API_URL: ${{ steps.railway-domain.outputs.url }}
          # PR head ref is attacker-controlled (fork PRs); keep it out of
          # the shell command line entirely and pass it as data instead.
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          npm install -g vercel@59.11.7

          # Scope VITE_API_BASE_URL to this PR's git branch (Vite bakes
          # VITE_* vars in at build time, so this must be set before the
          # build runs). Unlike cashus, cardstack's backend mounts its API
          # at the engine root (no "/api" prefix — see
          # backend/internal/adapters/http/routes/register_routes.go), so
          # this points straight at the Railway domain, matching
          # frontend/.env.example's VITE_API_BASE_URL=http://localhost:8080.
          printf '%s' "${RAILWAY_API_URL}" | \
            vercel env add VITE_API_BASE_URL preview "$HEAD_REF" \
              --token "$VERCEL_TOKEN" --force

          # Previews use Clerk's development instance, so they get its
          # publishable key (a public value; the Vercel project's own
          # VITE_CLERK_PUBLISHABLE_KEY is Production-only). Without it the
          # app renders a configuration error instead of signing anyone in.
          printf '%s' "${CLERK_PUBLISHABLE_KEY}" | \
            vercel env add VITE_CLERK_PUBLISHABLE_KEY preview "$HEAD_REF" \
              --token "$VERCEL_TOKEN" --force

          # Deliberately run from the repo root, not --cwd frontend: the
          # Vercel project already has Root Directory set to "frontend"
          # server-side (see frontend/.vercel/project.json), and Vercel
          # joins cwd + rootDirectory. --cwd frontend here resolves to the
          # nonexistent frontend/frontend and fails deploy outright
          # ("The provided path ... does not exist" — verified against a
          # live run). Repo root + the project's own rootDirectory setting
          # is the only combination that resolves to frontend/.
          #
          # Deploy without --prebuilt so the build runs on Vercel's own
          # infrastructure instead of locally on this runner. A local
          # `vercel build` is broken for this project: Vercel's
          # build-utils hardcodes infra-specific PATH overrides for the
          # detected package manager's install step (bun here), which
          # don't resolve to a real shell outside Vercel's own servers
          # ("spawn sh ENOENT" — see
          # https://github.com/vercel/vercel/issues/15204, same root
          # cause reported for pnpm). Building remotely also means the
          # branch-scoped env var above is honored automatically.
          deployment_url=$(vercel deploy \
            --token "$VERCEL_TOKEN" \
            --yes \
            -m "githubDeployment=1" \
            -m "githubCommitRef=$HEAD_REF" \
            -m "githubCommitSha=$HEAD_SHA")

          # Alias the deployment to the address the API already allows. The
          # REST API is used, as in cleanup, so the team comes from
          # VERCEL_ORG_ID the same way. Assigning an alias this project
          # already holds moves it to the new deployment, so every push keeps
          # the address. The step fails if
          # another project holds the name. If aliasing a CLI deployment turns
          # out not to work, the fallback is Vercel's per-branch address.
          vercel_api=https://api.vercel.com
          deployment_id=$(curl -fsS -G \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "$vercel_api/v13/deployments/${deployment_url#https://}" \
            --data-urlencode "teamId=$VERCEL_ORG_ID" | jq -r '.id // empty')
          if [[ -z "$deployment_id" ]]; then
            echo "::error::Could not look up Vercel deployment $deployment_url."
            exit 1
          fi
          alias_url="$vercel_api/v2/deployments/$deployment_id/aliases"
          curl -fsS -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            "$alias_url?teamId=$VERCEL_ORG_ID" \
            --data "$(jq -n --arg a "$FRONTEND_HOST" '{alias: $a}')"
          echo "url=https://$FRONTEND_HOST" >> "$GITHUB_OUTPUT"

      - name: Comment preview links on the PR
        uses: actions/github-script@v8
        env:
          RAILWAY_API_URL: ${{ steps.railway-domain.outputs.url }}
          FRONTEND_URL: ${{ steps.vercel.outputs.url }}
        with:
          script: |
            const marker = "### Preview environment";
            const body = [
              marker,
              "",
              `| | |`,
              `|---|---|`,
              `| Neon branch | \`${{ env.NEON_BRANCH_NAME }}\` |`,
              `| Railway API | ${process.env.RAILWAY_API_URL} |`,
              `| Frontend | ${process.env.FRONTEND_URL} |`,
              "",
              "The API deploys once, after the checks on this commit pass.",
              "Sign-in works once that deployment is live.",
              "",
              "Torn down automatically when this PR is merged or closed.",
            ].join("\n");
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  cleanup:
    name: Delete preview stack
    # Mirror provision's fork/Dependabot guard: those PRs were never
    # provisioned (no secrets), so there's nothing here to clean up either.
    if: >
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Delete Neon branch
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch: ${{ env.NEON_BRANCH_NAME }}
          api_key: ${{ secrets.NEON_API_KEY }}
      # Railway's PR environment is deleted automatically by Railway on
      # PR close/merge — nothing to do here for it. The Vercel steps below
      # clean up what provision created there: the alias, preview deployments
      # and the branch-scoped VITE_* env vars.

      - name: Delete this PR's Vercel alias
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          # Frees cardstack-pr-<number>.vercel.app so it never lingers on a
          # deployment that is about to be deleted. A 404 means it was never
          # created (provisioning failed early) or is already gone.
          status=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v2/aliases/$FRONTEND_HOST?teamId=$VERCEL_ORG_ID")
          if [[ "$status" == 404 ]]; then
            echo "No Vercel alias $FRONTEND_HOST found."
          elif [[ "$status" != 200 ]]; then
            echo "::error::Deleting Vercel alias $FRONTEND_HOST" \
              "answered $status."
            exit 1
          fi

      - name: Delete this PR's Vercel preview deployments
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          # Vercel doesn't delete a preview deployment just because its
          # branch/PR is gone — it only loses "active" protection and then
          # waits on the project's retention policy. Delete it here so
          # cleanup actually happens on PR close.
          #
          # /v6/deployments is paginated (~20/page by default); a branch
          # with more deployments than that would otherwise leave older
          # ones undeleted.
          until_param=""
          deleted_any=false
          while true; do
            extra_args=()
            if [[ -n "$until_param" ]]; then
              extra_args=(--data-urlencode "until=$until_param")
            fi
            page=$(curl -fsS \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -G "https://api.vercel.com/v6/deployments" \
              --data-urlencode "projectId=$VERCEL_PROJECT_ID" \
              --data-urlencode "teamId=$VERCEL_ORG_ID" \
              --data-urlencode "branch=$HEAD_REF" \
              --data-urlencode "target=preview" \
              "${extra_args[@]}")

            deployment_ids=$(echo "$page" | jq -r '.deployments[].uid')
            for id in $deployment_ids; do
              echo "Deleting Vercel deployment $id"
              curl -fsS -X DELETE \
                -H "Authorization: Bearer $VERCEL_TOKEN" \
                -G "https://api.vercel.com/v13/deployments/$id" \
                --data-urlencode "teamId=$VERCEL_ORG_ID"
              deleted_any=true
            done

            until_param=$(echo "$page" | jq -r '.pagination.next // empty')
            [[ -n "$until_param" ]] || break
          done

          if [[ "$deleted_any" == false ]]; then
            echo "No Vercel preview deployments found for branch $HEAD_REF."
          fi

      - name: Delete this PR's Vercel env vars
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          # Remove the branch-scoped VITE_API_BASE_URL and
          # VITE_CLERK_PUBLISHABLE_KEY that provision adds.
          # Uses the REST API rather than `vercel env rm`: the CLI exits
          # non-zero both for "no such entry" and for real failures, so it
          # can't make this step idempotent without swallowing auth/API
          # errors. Here, curl -f fails on any HTTP error, and an absent
          # entry is just an empty match list.
          #
          # curl and jq are deliberately not piped: the default shell has no
          # pipefail, so a curl failure (bad token, API error) would hand jq
          # empty input and the step would pass without deleting anything.
          #
          # The jq filter enforces key, preview target and exact branch, so
          # production and other branches' entries can never match.
          page=$(curl -fsS -G \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env" \
            --data-urlencode "teamId=$VERCEL_ORG_ID" \
            --data-urlencode "gitBranch=$HEAD_REF")
          ids=$(echo "$page" | jq -r --arg branch "$HEAD_REF" \
            '.envs[]
              | select((.key == "VITE_API_BASE_URL"
                  or .key == "VITE_CLERK_PUBLISHABLE_KEY")
                and .gitBranch == $branch
                and (.target | index("preview")))
              | .id')

          if [[ -z "$ids" ]]; then
            echo "No VITE_* env vars found for branch $HEAD_REF."
            exit 0
          fi

          env_url="https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/env"
          for id in $ids; do
            echo "Deleting Vercel env var $id"
            curl -fsS -X DELETE \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -G "$env_url/$id" \
              --data-urlencode "teamId=$VERCEL_ORG_ID"
          done
