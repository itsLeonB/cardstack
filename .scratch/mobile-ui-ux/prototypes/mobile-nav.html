<!doctype html>
<!-- Throwaway navigation prototype: three layouts around sample Collections content, ?variant=A|B|C. No live routes, auth, storage, or API calls. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cardstack mobile navigation prototype</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap');
:root { font-family: Figtree, var(--font-sans, sans-serif); color: var(--foreground, #fafaf7); color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; }
button, a { font: inherit; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
button { cursor: pointer; }
button:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--ring); outline-offset: 3px; }
button:hover, a:hover { filter: brightness(1.12); }
button:active { opacity: .8; }
button { color: inherit; }
svg { width: 22px; height: 22px; flex-shrink: 0; }
.lab { max-width: 440px; margin-inline: auto; display: grid; gap: 12px; }
.controls { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
.controls button, .switcher button { border: 1px solid var(--border, #555); background: var(--card, #25251f); border-radius: 999px; min-height: 44px; padding: 8px 14px; }
.controls button[aria-pressed=true] { text-decoration: underline; text-underline-offset: 4px; font-weight: 700; }
.hint { font-size: 13px; margin: 0; line-height: 1.5; }
.hint, .state { color: var(--foreground, #fafaf7); background: var(--card, #25251f); border-radius: 12px; padding: 12px 16px; }
.phone { --background: oklch(.153 .006 107.1); --foreground: oklch(.988 .003 106.5); --card: oklch(.228 .013 107.4); --muted: oklch(.286 .016 107.4); --muted-foreground: oklch(.737 .021 106.9); --primary: oklch(.795 .184 86.047); --primary-foreground: oklch(.421 .095 57.708); --border: oklch(1 0 0 / .17); --ring: oklch(.795 .184 86.047); color-scheme: dark; background: var(--background); color: var(--foreground); border: 1px solid var(--border); border-radius: 24px; overflow: hidden; position: relative; }
.phone.light { --background: oklch(1 0 0); --foreground: oklch(.153 .006 107.1); --card: oklch(.966 .005 106.5); --muted: oklch(.93 .007 106.5); --muted-foreground: oklch(.44 .031 107.3); --border: oklch(.78 .007 106.5); --ring: oklch(.421 .095 57.708); color-scheme: light; }
.app { position: relative; height: 590px; isolation: isolate; display: flex; flex-direction: column; }
header { flex-shrink: 0; padding: 8px 16px; min-height: 60px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border); }
.brand { font-weight: 800; letter-spacing: -.7px; font-size: 22px; display: flex; align-items: center; gap: 8px; margin-right: auto; }
.brand svg { color: var(--primary); }
.icon-button { display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--border); background: transparent; border-radius: 50%; min-width: 44px; min-height: 44px; }
.menu-trigger { display: flex; align-items: center; gap: 6px; background: transparent; border: 1px solid var(--border); border-radius: 999px; padding: 0 12px; min-height: 44px; font-size: 14px; }
.scroll { overflow: auto; flex: 1; min-height: 0; scroll-padding: 16px; }
.content { padding: 22px 16px 24px; display: flex; flex-direction: column; gap: 18px; }
.page-heading { display: flex; align-items: start; justify-content: space-between; gap: 8px; }
h1 { font-size: 27px; line-height: 1.15; margin: 0 0 7px; letter-spacing: -.7px; text-wrap: balance; }
h2 { margin: 0; font-size: 16px; }
p { margin: 0; line-height: 1.5; }
.muted { color: var(--muted-foreground); font-size: 14px; }
.primary { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 44px; border: 0; border-radius: 999px; background: var(--primary); color: var(--primary-foreground); padding: 8px 15px; font-weight: 600; font-size: 14px; }
.primary svg { width: 18px; height: 18px; }
.search { padding: 12px 14px; border: 1px solid var(--border); border-radius: 12px; display: flex; gap: 10px; align-items: center; font-size: 14px; color: var(--muted-foreground); }
.collection { border: 1px solid var(--border); border-radius: 16px; background: var(--card); display: flex; gap: 15px; padding: 16px; align-items: center; }
.cover { width: 48px; height: 62px; background: var(--muted); border: 1px solid var(--border); border-left: 6px solid var(--primary); border-radius: 5px 9px 9px 5px; display: grid; place-items: center; flex-shrink: 0; }
.collection-text { flex: 1; min-width: 0; }
.collection-text p { margin-top: 5px; }
.collection > svg { color: var(--muted-foreground); width: 18px; }
.bottom-nav { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-top: 1px solid var(--border); background: var(--card); padding: 5px 6px max(9px, env(safe-area-inset-bottom)); flex-shrink: 0; }
.nav-item { display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 4px; min-width: 0; min-height: 55px; text-decoration: none; color: var(--muted-foreground); border: 0; background: transparent; border-radius: 12px; padding: 7px 2px; font-size: 11px; }
.nav-item[aria-current=page] { color: var(--foreground); font-weight: 700; background: var(--muted); text-decoration: underline; text-underline-offset: 4px; }
.nav-item[aria-current=page] svg { color: var(--primary); }
.light .nav-item[aria-current=page] svg { color: var(--primary-foreground); }
.top-nav { display: flex; gap: 3px; padding: 7px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.top-nav a, .top-nav button { flex: 1; min-height: 44px; padding: 9px 6px; border: 0; border-radius: 10px; background: transparent; color: var(--muted-foreground); text-align: center; text-decoration: none; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 5px; }
.top-nav [aria-current=page] { color: var(--foreground); background: var(--muted); font-weight: 700; text-decoration: underline; text-underline-offset: 5px; }
.top-nav svg { width: 17px; height: 17px; }
.panel { background: var(--card); border: 1px solid var(--border); border-radius: 16px; position: absolute; right: 12px; top: 66px; width: min(280px, calc(100% - 24px)); padding: 10px; z-index: 2; box-shadow: 0 12px 30px #0005; }
.panel.bottom { top: auto; bottom: calc(79px + env(safe-area-inset-bottom)); }
.panel a, .drawer-links a { color: var(--foreground); text-decoration: none; min-height: 48px; display: flex; align-items: center; gap: 13px; padding: 12px; border-radius: 10px; font-size: 15px; }
.panel a:hover, .drawer-links a:hover { background: var(--muted); }
.panel [aria-current=page], .drawer-links [aria-current=page] { background: var(--muted); font-weight: 700; text-decoration: underline; text-underline-offset: 5px; }
.panel h2 { padding: 8px 12px; font-size: 13px; color: var(--muted-foreground); font-weight: 500; }
.panel[hidden] { display: none; }
.drawer { position: fixed; inset: auto; margin: 0; max-width: none; max-height: none; width: 310px; height: 590px; background: var(--card); color: var(--foreground); border: 0; border-left: 1px solid var(--border); padding: 18px; overscroll-behavior: contain; }
.drawer::backdrop { background: #0009; }
.drawer-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
.drawer h2 { font-size: 21px; }
.drawer-links { display: grid; gap: 5px; }
.drawer-note { margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--border); }
.switcher { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--card, #25251f); padding: 8px; border-radius: 16px; border: 1px solid var(--border, #555); }
.switcher button { min-width: 44px; padding-inline: 10px; }
.variant-copy { display: grid; gap: 4px; text-align: center; font-size: 14px; }
.variant-copy span { font-size: 12px; color: var(--muted-foreground, #bcbcb2); }
.state { font-size: 12px; line-height: 1.5; margin: 0; }
@media (max-width: 360px) { .brand { font-size: 20px; } .content { padding-inline: 12px; } .primary { padding-inline: 11px; } }
@media (forced-colors: active) { [aria-current=page] { outline: 2px solid Highlight; } }
</style>
</head>
<body>
<div class="lab">
  <div class="controls" aria-label="Prototype controls">
    <button id="signed-in" aria-pressed="true">Signed in</button>
    <button id="guest" aria-pressed="false">Guest</button>
    <button id="theme" aria-pressed="false">Light theme</button>
  </div>
  <p class="hint">Throwaway prototype · sample data · nothing saves</p>
  <div class="phone" id="phone"><div class="app" id="app"></div></div>
  <div class="switcher" aria-label="Compare navigation layouts">
    <button id="prev" aria-label="Previous navigation layout">←</button>
    <p class="variant-copy"><strong id="variant-name"></strong><span id="variant-help"></span></p>
    <button id="next" aria-label="Next navigation layout">→</button>
  </div>
  <p class="state" id="state" role="status" aria-live="polite"></p>
</div>
<script>
const paths = {
  catalog: '<path d="M3 4h7v16H3zM14 4h7v16h-7zM6 8h1M17 8h1"/>',
  collections: '<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 3v18M12 8h4M12 12h4"/>',
  wishlist: '<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/>',
  trades: '<path d="M3 7h17l-4-4M21 17H4l4 4M20 7l-4 4M4 17l4-4"/>',
  inventory: '<path d="M3 4h7v7H3zM14 4h7v7h-7zM3 15h7v6H3zM14 15h7v6h-7z"/>',
  account: '<circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/>',
  more: '<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',
  menu: '<path d="M4 6h16M4 12h16M4 18h16"/>',
  close: '<path d="m6 6 12 12M6 18 18 6"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  search: '<circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/>',
  arrow: '<path d="m9 6 6 6-6 6"/>',
  camera: '<path d="M8 5 6 8H3v12h18V8h-3l-2-3Z"/><circle cx="12" cy="13" r="4"/>',
  login: '<path d="M12 3h8v18h-8M3 12h12m-4-4 4 4-4 4"/>',
  register: '<circle cx="9" cy="8" r="4"/><path d="M2 21v-2a7 7 0 0 1 12-5M19 13v8m-4-4h8"/>'
};
const icon = name => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name]}</svg>`;
const labels = { catalog: 'Catalog', collections: 'Collections', wishlist: 'Wishlist', trades: 'Trades', inventory: 'Master Inventory', account: 'Account', login: 'Log in', register: 'Register' };
const variants = {
  A: ['A · Bottom navigation', 'Four destinations + More. Recommended.'],
  B: ['B · Side panel', 'All destinations behind one Menu button.'],
  C: ['C · Header navigation', 'Three destinations + More below the brand.']
};
const query = new URLSearchParams(location.search);
let variant = Object.hasOwn(variants, query.get('variant')) ? query.get('variant') : 'A';
let signedIn = true;
let selected = 'collections';
let light = false;
const app = document.getElementById('app');
const link = (key, cls = '') => `<a href="#${key}" class="${cls}" data-destination="${key}" ${selected === key ? 'aria-current="page"' : ''}>${icon(key)}<span>${labels[key]}</span></a>`;
function content() {
  if (!signedIn) return `<div class="page-heading"><div><h1>Your cards.<br>Your collection.</h1><p class="muted">Track the cards you own and find the ones you want.</p></div></div><div class="collection"><div class="cover">${icon('collections')}</div><div class="collection-text"><h2>Keep every collection in one place</h2><p class="muted">Browse Cards before you sign in.</p></div></div><p class="muted">Guest preview: try Catalog or open the menu.</p>`;
  if (selected === 'collections') return `<div class="page-heading"><div><h1>Collections</h1><p class="muted">3 Collections · 328 Cards</p></div><button class="primary" data-demo="Create Collection">${icon('plus')}Create</button></div><div class="search">${icon('search')}Find a Collection…</div>${[['My binder','180 Cards · Binder'],['Trade extras','96 Cards · Box'],['Current deck','52 Cards · Deck']].map(([name,desc])=>`<div class="collection"><div class="cover">${icon('collections')}</div><div class="collection-text"><h2>${name}</h2><p class="muted">${desc}</p></div>${icon('arrow')}</div>`).join('')}<p class="muted">Master Inventory combines the Cards in all your Collections.</p>`;
  if (selected === 'trades') return `<div class="page-heading"><div><h1>Trades</h1><p class="muted">Your exchanges and history</p></div><button class="primary" data-demo="Start a Trade">${icon('plus')}Start</button></div><div class="collection"><div class="cover">${icon('trades')}</div><div class="collection-text"><h2>Trade with Alex</h2><p class="muted">Negotiating · 4 Cards offered</p></div>${icon('arrow')}</div><div class="collection"><div class="collection-text"><h2>Trade with Sam</h2><p class="muted">Executed · Yesterday</p></div>${icon('arrow')}</div><p class="muted">Trades now has its own destination in this sketch. No trade actions run.</p>`;
  return `<div class="page-heading"><div><h1>${labels[selected]}</h1><p class="muted">Navigation destination preview</p></div></div><div class="collection"><div class="cover">${icon(selected)}</div><div class="collection-text"><h2>${selected === 'inventory' ? '328 Cards across 3 Collections' : selected === 'wishlist' ? 'Cards you want to collect' : selected === 'catalog' ? 'Find your next Card' : 'Profile and settings'}</h2><p class="muted">Sample data, not your account</p></div></div><p class="muted">Try switching destinations, opening More, or comparing another layout.</p>`;
}
function render() {
  const all = signedIn ? ['catalog','collections','wishlist','trades','inventory','account'] : ['catalog','login','register'];
  const menuButton = '<button class="menu-trigger" id="menu-trigger" aria-expanded="false" aria-controls="navigation-panel">'+icon('menu')+'Menu</button>';
  const trigger = variant === 'B' || !signedIn ? menuButton : '<button class="icon-button" data-destination="account" aria-label="Account">'+icon('account')+'</button>';
  const moreButton = cls => `<button class="${cls}" id="more-trigger" aria-expanded="false" aria-controls="navigation-panel">${icon('more')}<span>More</span></button>`;
  const bottom = signedIn && variant === 'A' ? `<nav class="bottom-nav" aria-label="Main">${['catalog','collections','wishlist','trades'].map(k=>link(k,'nav-item')).join('')}${moreButton('nav-item')}</nav>` : '';
  const top = signedIn && variant === 'C' ? `<nav class="top-nav" aria-label="Main">${['catalog','collections','trades'].map(k=>link(k)).join('')}${moreButton('')}</nav>` : '';
  const secondary = !signedIn || variant === 'B' ? all : variant === 'A' ? ['inventory','account'] : ['wishlist','inventory','account'];
  app.innerHTML = `<header><div class="brand">${icon('collections')}Cardstack</div>${trigger}</header>${top}<div class="scroll" tabindex="0" aria-label="Page content"><main class="content">${content()}</main></div>${bottom}${variant === 'B' ? `<dialog class="drawer" id="navigation-panel" aria-labelledby="drawer-title"><div class="drawer-head"><h2 id="drawer-title">Your Cardstack</h2><button class="icon-button" id="close-panel" aria-label="Close navigation">${icon('close')}</button></div><nav class="drawer-links" aria-label="Main">${all.map(k=>link(k)).join('')}</nav><p class="muted drawer-note">${signedIn ? 'Signed-in navigation preview' : 'Browse first. Sign in to keep your Cards.'}</p></dialog>` : `<nav class="panel ${variant === 'A' && signedIn ? 'bottom' : ''}" id="navigation-panel" aria-label="${signedIn ? 'More destinations' : 'Guest navigation'}" hidden>${secondary.map(k=>link(k)).join('')}</nav>`}`;
  document.getElementById('variant-name').textContent = variants[variant][0];
  document.getElementById('variant-help').textContent = variants[variant][1];
  document.getElementById('signed-in').setAttribute('aria-pressed', String(signedIn));
  document.getElementById('guest').setAttribute('aria-pressed', String(!signedIn));
  report();
  const triggerNode = document.getElementById('menu-trigger') || document.getElementById('more-trigger');
  if (triggerNode) triggerNode.onclick = () => {
    const panel = document.getElementById('navigation-panel');
    if (variant === 'B') {
      const frame = document.getElementById('phone').getBoundingClientRect();
      const width = Math.min(310, frame.width * .86);
      Object.assign(panel.style, { top: `${frame.top+1}px`, left: `${frame.right-width-1}px`, width: `${width}px`, height: `${frame.height-2}px` });
      panel.showModal(); document.getElementById('close-panel').focus();
    }
    else panel.hidden = !panel.hidden;
    triggerNode.setAttribute('aria-expanded', String(variant === 'B' || !panel.hidden));
  };
  const drawer = app.querySelector('dialog');
  if (drawer) {
    const close = () => { drawer.close(); triggerNode.setAttribute('aria-expanded','false'); triggerNode.focus(); };
    document.getElementById('close-panel').onclick = close;
    drawer.oncancel = event => { event.preventDefault(); close(); };
    drawer.onclick = event => { const r=drawer.getBoundingClientRect(); if(event.clientX<r.left || event.clientX>r.right || event.clientY<r.top || event.clientY>r.bottom) close(); };
  }
}
function report(message = '') {
  document.getElementById('state').textContent = `${variant} · ${signedIn ? 'Signed in' : 'Guest'} · ${labels[selected]} · ${light ? 'Light' : 'Dark'}${message ? ' · '+message : ''}`;
}
function cycle(delta) {
  variant = ['A','B','C'][(['A','B','C'].indexOf(variant)+delta+3)%3];
  const url = new URL(location.href); url.searchParams.set('variant',variant);
  history.replaceState(null,'',url);
  render();
}
app.onclick = event => {
  const destination = event.target.closest('[data-destination]');
  if (destination) {
    event.preventDefault();
    const key = destination.dataset.destination;
    if (key === 'login' || key === 'register') { report(`${labels[key]} selected; no real authentication`); return; }
    if (!signedIn && key !== 'catalog') return;
    const drawer = app.querySelector('dialog[open]'); if (drawer) drawer.close();
    selected = key; render();
  }
  const demo = event.target.closest('[data-demo]');
  if (demo) report(`${demo.dataset.demo}: demonstration only`);
};
document.getElementById('prev').onclick = () => cycle(-1);
document.getElementById('next').onclick = () => cycle(1);
document.getElementById('signed-in').onclick = () => { signedIn=true; selected='collections'; render(); };
document.getElementById('guest').onclick = () => { signedIn=false; selected='catalog'; render(); };
document.getElementById('theme').onclick = event => { light=!light; document.getElementById('phone').classList.toggle('light',light); event.currentTarget.setAttribute('aria-pressed',String(light)); event.currentTarget.textContent=light?'Dark theme':'Light theme'; report(); };
document.addEventListener('keydown', event => {
  if (event.key === 'Escape') {
    const panel = app.querySelector('nav.panel:not([hidden])');
    if (panel) { panel.hidden=true; const trigger=document.getElementById('menu-trigger')||document.getElementById('more-trigger'); trigger.setAttribute('aria-expanded','false'); trigger.focus(); }
  }
  if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey || event.target.closest('input, textarea, select, button, a, [contenteditable], dialog[open]')) return;
  if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') { event.preventDefault(); cycle(event.key === 'ArrowLeft' ? -1 : 1); }
});
document.addEventListener('click', event => {
  const panel=app.querySelector('nav.panel:not([hidden])');
  if(panel && !panel.contains(event.target) && !event.target.closest('#menu-trigger, #more-trigger')) { panel.hidden=true; const trigger=document.getElementById('menu-trigger')||document.getElementById('more-trigger'); trigger.setAttribute('aria-expanded','false'); }
});
render();
</script>
</body>
</html>
